[package]
name = "ootle_split"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Ootle Split: an immutable on-chain revenue/prize splitter for Tari Ootle."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tari_template_lib = "=0.41.0"

[dev-dependencies]
tari_template_test_tooling = "=0.54.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 0
incremental = false

[workspace]
